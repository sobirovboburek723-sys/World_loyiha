<head>
    <meta charset="UTF-8">

    <title>World map</title>
    
    <!-- Leaflet CSS - Xarita kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05070a;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
            background: #05070a;
        }

        /* Ma'lumot paneli - Neon uslubida */
        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-left: 4px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            border-radius: 10px;
            z-index: 1000;
            display: none; /* Bosilmaguncha yashirin */
        }

        .info-box h2 {
            margin: 0;
            color: #00f2ff;
            text-transform: uppercase;
            font-size: 22px;
        }

        .info-box p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }

        .region-tag {
            display: inline-block;
            background: rgba(0, 242, 255, 0.1);
            color: #00f2ff;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 5px;
            font-size: 12px;
            border: 3px solid rgb(0, 238, 255);
        }

        /* Xaritadagi davlatlar ustiga borganda effekt */
        .leaflet-interactive:hover {
            fill-opacity: 0.8;
            stroke: #02e1ff;
            stroke-width: 4;
            cursor: crosshair;
        }
    </style>
</head>

          "New Caledonia": ["North Province", "South Province", "Loyalty Islands Province"],
          "Dem. Rep. Korea": ["Pyongyang", "North Pyongan", "South Pyongan", "Kangwon", "Ryanggang"],
          "Korea": ["Seoul", "Gyeonggi", "Busan", "Daegu", "Jeju"],
          "Somaliland": ["Hargeisa", "Berbera", "Burao", "Borama", "Erigavo"],
        };

        // Dunyo chegaralarini yuklash (GeoJSON)
        fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        fillColor: '#1a2a3a',
                        weight: 1,
                        opacity: 1,
                        color: '#334455',
                        fillOpacity: 0.6
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on('click', function (e) {
                            const name = feature.properties.name;
                            showCountryInfo(name);
                            
                            // Ovozli aytish
                            speak(name);

                            // Xaritani o'sha davlatga yaqinlashtirish
                            map.fitBounds(e.target.getBounds());
                        });
                    }
                }).addTo(map);
            });

        function showCountryInfo(name) {
            const box = document.getElementById('infoBox');
            const nameEl = document.getElementById('countryName');
            const listEl = document.getElementById('regionsList');

            nameEl.innerText = name;
            listEl.innerHTML = '';
            box.style.display = 'block';

            // Agar ma'lumot bo'lsa viloyatlarni chiqarish
            const regions = countryData[name] || ["Ma'lumotlar bazada mavjud emas"];
            
            regions.forEach(r => {
                const span = document.createElement('span');
                span.className = 'region-tag';
                span.innerText = r;
                listEl.appendChild(span);
            });
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Avvalgi ovozni to'xtatish
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US'; // Ko'pchilik tizimda inglizcha aniq ishlaydi
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
